<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>مینی‌اپ بله 3D</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #output { margin-top: 20px; }
    #canvas3d { width: 600px; height: 400px; border: 1px solid #ccc; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>مینی‌اپ بله ساده با 3D</h1>
  
  <button id="showHashtags">نمایش هشتگ‌ها</button>
  <div id="output"></div>

  <canvas id="canvas3d"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script>
    // نمایش هشتگ‌ها
    const hashtags = ['#بله', '#مینی‌اپ', '#۳بعدی'];
    document.getElementById('showHashtags').addEventListener('click', () => {
      const output = document.getElementById('output');
      output.innerHTML = '<h3>هشتگ‌ها:</h3><ul>' + 
        hashtags.map(tag => `<li>${tag}</li>`).join('') + '</ul>';
    });

    // قسمت تبدیل دو بعدی به سه بعدی با three.js (مثال ساده)
    const canvas = document.getElementById('canvas3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({canvas});
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);

    // شکل سه بعدی: مکعب ساده
    const geometry = new THREE.BoxGeometry();
    const material = new THREE.MeshBasicMaterial({color: 0x00ff00, wireframe: true});
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    camera.position.z = 5;

    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
