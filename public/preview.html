<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>پیش‌نمایش سه‌بعدی مگس</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }
        #controls-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 100;
            display: flex;
            gap: 10px;
            font-family: monospace;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="info">
        🦟 مدل سه‌بعدی مگس – برای دیدن جزئیات، از ماوس برای چرخش و زوم استفاده کنید
    </div>
    <div id="controls-panel">
        <button id="toggleWireframe">حالت سیمی / جامد</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        scene.fog = new THREE.FogExp2(0x111122, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(1.0, 0.8, 1.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = true;
        controls.zoomSpeed = 1.5;
        controls.enablePan = true;
        controls.panSpeed = 0.8;
        controls.target.set(0, 0.05, 0);

        // نورها
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(1, 2, 1);
        scene.add(mainLight);
        
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.6);
        fillLight.position.set(-1, 1, 0.5);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0x4466cc, 0.5);
        backLight.position.set(0, 0.5, -1);
        scene.add(backLight);
        
        const rimLight = new THREE.PointLight(0xffaa66, 0.4);
        rimLight.position.set(1, 1, -1);
        scene.add(rimLight);

        // بارگذاری مدل
        const loader = new OBJLoader();
        let currentModel = null;
        let wireframeMode = false;

        loader.load('/models/3d_object.obj', (obj) => {
            currentModel = obj;
            obj.traverse(child => {
                if (child.isMesh) {
                    child.material = new THREE.MeshStandardMaterial({
                        color: 0xcdb38c,
                        roughness: 0.5,
                        metalness: 0.1,
                        emissive: 0x221100,
                        wireframe: false
                    });
                    child.castShadow = true;
                    child.receiveShadow = false;
                }
            });
            scene.add(obj);
            
            // تنظیم خودکار دوربین بر اساس bounding box
            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * Math.PI / 180;
            let dist = maxDim / (2 * Math.tan(fov / 2));
            dist *= 1.2;
            camera.position.set(dist * 0.8, dist * 0.6, dist);
            controls.target.copy(center);
            controls.update();
        }, undefined, (error) => console.error('Error loading model:', error));

        // دکمه تغییر حالت سیمی/جامد
        document.getElementById('toggleWireframe').addEventListener('click', () => {
            wireframeMode = !wireframeMode;
            if (currentModel) {
                currentModel.traverse(child => {
                    if (child.isMesh) {
                        child.material.wireframe = wireframeMode;
                    }
                });
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
