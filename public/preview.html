<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>پیش‌نمایش سه‌بعدی – مگس</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 100;
            font-size: 14px;
            pointer-events: none;
            border-left: 3px solid #ffaa44;
            font-weight: 500;
        }
        #controls-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(8px);
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            gap: 12px;
            z-index: 100;
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.2);
        }
        button {
            background: #3a3a4a;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }
        button:hover { background: #5a5a7a; transform: scale(1.02); }
        button.active { background: #ffaa44; color: #1e1e2a; box-shadow: 0 0 8px #ffaa44; }
    </style>
</head>
<body>
    <div id="info">
        🦟 مدل سه‌بعدی مگس – کلیک و بکشید برای چرخش | اسکرول برای زوم
    </div>
    <div id="controls-panel">
        <button id="btnSolid" class="active">جامد</button>
        <button id="btnWire">سیمی</button>
        <button id="btnPoints">نقاط</button>
        <button id="btnReset">🔄 تنظیم دوربین</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // --- راه‌اندازی صحنه ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        scene.fog = new THREE.FogExp2(0x111122, 0.012);

        // --- دوربین (زاویه ابتدایی) ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(1.5, 1.0, 1.8);
        camera.lookAt(0, 0, 0);

        // --- رندرر با کیفیت بالا ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- کنترل‌های دوربین ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.enablePan = true;
        controls.panSpeed = 0.8;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0, 0);

        // --- نورپردازی پیشرفته ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffcc88, 1.2);
        mainLight.position.set(1.2, 2.0, 1.0);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        fillLight.position.set(-1.0, 0.5, 0.8);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0x4466cc, 0.4);
        backLight.position.set(0, 0.5, -1.2);
        scene.add(backLight);
        
        const bottomLight = new THREE.PointLight(0x8866cc, 0.3);
        bottomLight.position.set(0, -0.8, 0);
        scene.add(bottomLight);
        
        const rimLight = new THREE.PointLight(0xffaa66, 0.4);
        rimLight.position.set(0.8, 1.2, -0.9);
        scene.add(rimLight);

        // گرید کمکی (کمک به درک ابعاد)
        const gridHelper = new THREE.GridHelper(2.5, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.6;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);

        // --- بارگذاری مدل OBJ ---
        const loader = new OBJLoader();
        let currentModel = null;
        let currentMode = 'solid';

        function applyMaterialMode(mesh) {
            if (!mesh.isMesh) return;
            const mat = mesh.material;
            if (currentMode === 'solid') {
                mat.wireframe = false;
                mat.transparent = false;
            } else if (currentMode === 'wire') {
                mat.wireframe = true;
                mat.color.setHex(0x88aaff);
            } else if (currentMode === 'points') {
                mat.wireframe = true;
                mat.color.setHex(0xffaa88);
            }
            mat.needsUpdate = true;
        }

        function setMode(mode) {
            currentMode = mode;
            if (!currentModel) return;
            currentModel.traverse(child => {
                if (child.isMesh) applyMaterialMode(child);
            });
            document.getElementById('btnSolid').classList.toggle('active', mode === 'solid');
            document.getElementById('btnWire').classList.toggle('active', mode === 'wire');
            document.getElementById('btnPoints').classList.toggle('active', mode === 'points');
        }

        function loadModel() {
            loader.load('/models/3d_object.obj', (obj) => {
                if (currentModel) scene.remove(currentModel);
                currentModel = obj;
                obj.traverse(child => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({
                            color: 0xcdb38c,
                            roughness: 0.45,
                            metalness: 0.15,
                            emissive: 0x221100,
                            side: THREE.DoubleSide
                        });
                        child.castShadow = true;
                        applyMaterialMode(child);
                    }
                });
                scene.add(obj);
                
                // تنظیم دوربین بر اساس ابعاد مدل
                const box = new THREE.Box3().setFromObject(obj);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * Math.PI / 180;
                let distance = maxDim / (2 * Math.tan(fov / 2));
                distance *= 1.2;
                camera.position.set(distance * 0.9, distance * 0.6, distance);
                controls.target.copy(center);
                controls.update();
            }, undefined, (error) => {
                console.error('خطا در بارگذاری مدل:', error);
                document.getElementById('info').innerHTML = '⚠️ خطا در بارگذاری مدل. فایل OBJ را بررسی کنید.';
            });
        }

        document.getElementById('btnSolid').addEventListener('click', () => setMode('solid'));
        document.getElementById('btnWire').addEventListener('click', () => setMode('wire'));
        document.getElementById('btnPoints').addEventListener('click', () => setMode('points'));
        document.getElementById('btnReset').addEventListener('click', () => {
            if (currentModel) {
                const box = new THREE.Box3().setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * Math.PI / 180;
                let dist = maxDim / (2 * Math.tan(fov / 2));
                dist *= 1.3;
                camera.position.set(dist * 0.8, dist * 0.6, dist);
                controls.target.copy(center);
                controls.update();
            } else {
                camera.position.set(1.5, 1.0, 1.8);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loadModel();
    </script>
</body>
</html>
