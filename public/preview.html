<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پیش‌نمایش مدل سه‌بعدی - مگس</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Tahoma; background-color: #111122; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            z-index: 10;
            pointer-events: none;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 10;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="info">
        🧬 مدل سه‌بعدی مگس (حالت سیمی) – برای بزرگ‌نمایی از اسکرول ماوس استفاده کنید
    </div>
    <div id="controls">
        🖱️ کلیک و بکشید برای چرخش | اسکرول برای زوم
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        
        // دوربین با فاصله کمتر (زوم بیشتر)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(1.2, 1.2, 1.2);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // کنترلر Orbit (اجازه زوم و چرخش)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = true;
        controls.zoomSpeed = 1.5;
        controls.enablePan = true;
        controls.panSpeed = 0.8;
        controls.target.set(0, 0, 0);

        // نورپردازی
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x88aaff, 0.5);
        backLight.position.set(-1, 1, -1);
        scene.add(backLight);

        // بارگذاری مدل OBJ از مسیر public/models/3d_object.obj
        const objUrl = '/models/3d_object.obj';
        const loader = new OBJLoader();
        let model;
        loader.load(objUrl, (obj) => {
            model = obj;
            obj.traverse(child => {
                if (child.isMesh) {
                    child.material.wireframe = true;
                    child.material.color.setHex(0x88aaff);
                    child.material.emissive = 0x224466;
                }
            });
            scene.add(obj);
            
            // تنظیم خودکار مرکز و فاصله دوربین بر اساس bounding box
            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / (2 * Math.tan(fov / 2)));
            cameraZ *= 1.2; // کمی فاصله بیشتر
            camera.position.set(cameraZ * 0.8, cameraZ * 0.8, cameraZ);
            controls.target.copy(center);
            controls.update();
        }, undefined, (error) => console.error('خطا در بارگذاری مدل:', error));

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // به روزرسانی تعاملات
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // نمایش پیام در کنسول
        console.log('پیش‌نمایش مگس با قابلیت زوم فعال شد');
    </script>
</body>
</html>
